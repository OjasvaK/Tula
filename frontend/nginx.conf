server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom client-side routes (e.g. /login) have no matching
    # file on disk - fall back to index.html and let the router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
