name: Deploy backend to Hugging Face

# Copies backend/ into a Hugging Face Space, which rebuilds and restarts it.
# Needs the repo variable HF_SPACE (e.g. "OjasvaK/tula-api") and the repo
# secret HF_TOKEN (a Hugging Face token with write access). Skipped until
# HF_SPACE is set.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-hf.yml"
  workflow_dispatch:

jobs:
  sync:
    name: Push backend to the Space
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Push backend/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # The Space holds only the backend, at its root. Hugging Face rejects
          # plain binary files, so the sample label photos stay behind, and the
          # tests aren't needed to serve.
          rsync -a --exclude 'sample_data/images/*' --exclude tests backend/ space/
          touch space/sample_data/images/.gitkeep

          cd space
          git init -q -b main
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
